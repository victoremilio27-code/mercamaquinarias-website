  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mantenimiento | MercaMaquinarias</title>
  <style>
    :root {
      color-scheme: light dark;
      --fondo: #f7f5ef;
      --superficie: #ffffff;
      --texto: #071a2b;
      --secundario: #60717d;
      --acento: #f2a900;
      --borde: #dedcd4;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--fondo);
      color: var(--texto);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main {
      width: min(100%, 680px);
      padding: clamp(28px, 7vw, 56px);
      background: var(--superficie);
      border: 1px solid var(--borde);
      border-top: 5px solid var(--acento);
      border-radius: 16px;
      box-shadow: 0 18px 50px rgb(7 26 43 / 10%);
    }
    .logo {
      display: block;
      width: min(100%, 390px);
      height: auto;
      margin-bottom: clamp(32px, 7vw, 52px);
      color: var(--texto);
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.85rem, 6vw, 3rem);
      line-height: 1.08;
      letter-spacing: -.025em;
    }
    p { margin: 0; font-size: 1.05rem; line-height: 1.65; }
    .detalle { color: var(--secundario); }
    .soporte {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--borde);
      font-size: .95rem;
    }
    a { color: var(--texto); font-weight: 700; text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid var(--acento); outline-offset: 4px; }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #071a2b;
        --superficie: #0c2438;
        --texto: #f7f5ef;
        --secundario: #a2b4c1;
        --borde: rgb(255 255 255 / 13%);
      }
      main { box-shadow: 0 18px 50px rgb(0 0 0 / 30%); }
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      main { padding: 28px 22px 30px; }
      .logo { margin-bottom: 32px; }
    }
  </style>
