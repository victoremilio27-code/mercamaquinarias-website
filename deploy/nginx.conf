# nginx para MercaMaquinarias.
# Instalar en /etc/nginx/sites-available/mercamaquinarias y enlazar a
# sites-enabled. Ya viene con el dominio real puesto.
#
# Este es el archivo que está montado en producción, con certificado
# incluido. Las líneas marcadas «managed by Certbot» las escribió
# certbot y son las que busca al renovar: no tocarlas.
#
# En una máquina nueva, sin certificado todavía, hay que arrancar con
# el bloque del puerto 80 sirviendo el sitio (no redirigiendo), correr
# `certbot --nginx -d mercamaquinarias.com -d www.mercamaquinarias.com`
# y luego volver a este archivo. Si se redirige a https antes de tener
# el certificado, el sitio queda inalcanzable.
#
# La dirección buena es https://mercamaquinarias.com, sin www. Todo lo
# demás llega ahí con un 301.

# http, con y sin www: subir a https y de paso quitar el www.
server {
    listen 80;
    listen [::]:80;
    server_name mercamaquinarias.com www.mercamaquinarias.com;
    return 301 https://mercamaquinarias.com$request_uri;
}

# https con www: al dominio sin www, que es el canónico.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mercamaquinarias.com;

    ssl_certificate /etc/letsencrypt/live/mercamaquinarias.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mercamaquinarias.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://mercamaquinarias.com$request_uri;
}

# El sitio.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mercamaquinarias.com;

    ssl_certificate /etc/letsencrypt/live/mercamaquinarias.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mercamaquinarias.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # No anunciar la versión de nginx en las cabeceras ni en los errores.
    server_tokens off;

    # Subida de fotos de equipos: el límite por defecto (1 MB) se queda corto.
    client_max_body_size 12M;

    # Comprimir lo que se sirve en texto. styles.css ronda los 90 KB
    # y app.js los 65 KB; comprimidos bajan a una fracción.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Fotografías de los anuncios, servidas por nginx directamente.
    #
    # Podrían pasar por Node —lo sabe hacer y pone las mismas
    # cabeceras—, pero cada foto ocuparía un ciclo del proceso que
    # atiende la API. nginx las sirve con sendfile sin despeinarse, y
    # el catálogo es justo la pantalla que pide veinticuatro a la vez.
    #
    # El nombre de cada archivo es aleatorio y nunca se reescribe, así
    # que `immutable` es cierto: una foto descargada no hay que volver
    # a pedirla jamás.
    location /fotos/ {
        alias /var/lib/mercamaquinarias/fotos/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Los videos de los anuncios. Node sabe servirlos —con peticiones
    # por rangos incluidas, que es lo que necesita <video> para poder
    # adelantar y lo que exige Safari en el iPhone— pero aquí importa
    # más que en las fotos: reproducir un video son minutos de flujo
    # continuo, y este VPS tiene UN núcleo. Cada video en marcha sería
    # un trozo del proceso que atiende la API.
    #
    # nginx hace rangos de serie y con sendfile. Que Node lo sepa hacer
    # sigue valiendo: en desarrollo no hay nginx delante.
    location /videos/ {
        alias /var/lib/mercamaquinarias/videos/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # De quién es la petición, para los límites por origen.
        #
        # CF-Connecting-IP la escribe Cloudflare con la IP real del
        # visitante, sustituyéndola siempre: es la que el servidor
        # prefiere y la que no se puede falsificar desde fuera.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # X-Forwarded-For queda de reserva, y va con $remote_addr y NO
        # con $proxy_add_x_forwarded_for: aquel AÑADE a lo que mandara
        # el cliente, de modo que el primer valor de la lista lo
        # escribía quien llamaba. Bastaba con cambiarlo en cada
        # petición para anular todos los topes del sitio: contraseñas
        # probadas, cuentas creadas, códigos pedidos y mensajes al
        # asistente, que cuestan dinero de verdad.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # El asistente hace hasta dos intentos de 30 s contra la API
        # de Anthropic, más la espera entre ellos. Con 60 s, nginx
        # cortaba con su propio 504 justo antes de que el servidor
        # pudiera dar el mensaje amable que tiene preparado.
        proxy_read_timeout 75s;
    }
}
