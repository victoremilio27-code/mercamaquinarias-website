# Rangos de Cloudflare: de quién se cree nginx el CF-Connecting-IP.
#
# Instalar en /etc/nginx/snippets/cloudflare.conf. Lo incluye el
# bloque del sitio de deploy/nginx.conf, y deploy/cortafuegos-cloudflare.sh
# lee de aquí los mismos rangos para abrir 80/443 solo a Cloudflare:
# una sola lista, para que nginx y el cortafuegos no discrepen.
#
# Por qué existe (#169): nginx reenviaba a Node el CF-Connecting-IP que
# mandara el cliente, sin mirar quién lo mandaba. Quien entrara directo
# a la IP del droplet —se averigua con escáneres de certificados o con
# el historial de DNS— podía poner uno distinto en cada petición y
# anular todos los topes por origen: contraseñas, altas, códigos y el
# asistente, que cuesta dinero. Era el agujero que ya se había cerrado
# con X-Forwarded-For, reabierto por la otra cabecera.
#
# Con esto, el módulo realip solo sustituye $remote_addr por el valor
# de la cabecera cuando la conexión viene de uno de estos rangos. Si
# viene de cualquier otro sitio, la cabecera se ignora y $remote_addr
# sigue siendo la IP real de la conexión.
#
# Refrescar: Cloudflare publica la lista en https://www.cloudflare.com/ips-v4
# y https://www.cloudflare.com/ips-v6. Cambia muy de tarde en tarde;
# `bash deploy/cortafuegos-cloudflare.sh --comprobar` en el VPS dice si
# esta copia se ha quedado vieja. Si cambia, se edita aquí, se vuelve a
# copiar, `nginx -t && systemctl reload nginx` y se repite el script.
# Copiada el 2026-10-06.

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
